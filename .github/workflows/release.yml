name: Release Distribution & Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 2.1.3)'
        required: true
        default: '2.1.3'

permissions:
  contents: write

jobs:
  verify-and-distribute:
    name: Verify Release Metadata and Distribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Release Repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            TAG_NAME="v${{ inputs.version }}"
          else
            TAG_NAME="v2.1.3"
          fi
          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "Processing release for tag: $TAG_NAME"

      - name: Validate Release Metadata (release.json)
        run: |
          if [ -f "release.json" ]; then
            python3 -c "
          import json, sys
          with open('release.json', 'r') as f:
              data = json.load(f)
          print('Release metadata verified successfully.')
          print('Version:', data.get('version'))
          print('Download URL:', data.get('downloadUrl'))
          print('SHA-256:', data.get('sha256'))
          "
          else
            echo "Warning: release.json not found."
          fi

      - name: Verify Release Assets Policy
        run: |
          echo "======================================================="
          echo " DhirDhar Release Distribution Repository Policy:       "
          echo " - RELEASES ONLY                                       "
          echo " - Production application binaries distributed via     "
          echo "   GitHub Releases Assets.                             "
          echo " - No application source code committed to repository. "
          echo "======================================================="
