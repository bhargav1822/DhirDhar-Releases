name: Release Build and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 2.1.1)'
        required: true
        default: '2.1.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Restore Dependencies
        run: |
          dotnet restore "DhirDhar Solution/DhirDhar Solution.slnx" -p:Platform=x64

      - name: Build Solution in Release x64
        run: |
          dotnet build "DhirDhar Solution/DhirDhar Solution.slnx" -c Release -p:Platform=x64 --no-restore

      - name: Run Automated Tests
        run: |
          dotnet test "DhirDhar Solution/DhirDhar Solution.slnx" -c Release -p:Platform=x64 --no-build --verbosity normal

      - name: Publish Self-Contained Release win-x64
        run: |
          dotnet publish "DhirDhar Solution/src/DhirDhar.Desktop/DhirDhar.Desktop.csproj" -c Release -r win-x64 --self-contained true -o "DhirDhar Solution/Release"
          dotnet publish "DhirDhar Solution/src/DhirDhar.Updater/DhirDhar.Updater.csproj" -c Release -r win-x64 --self-contained true -o "DhirDhar Solution/Release"

      - name: Strip Debug Symbols
        run: |
          Get-ChildItem -Path "DhirDhar Solution/Release" -Include "*.pdb","*.xml","*.log","*.tmp" -Recurse -File | Remove-Item -Force

      - name: Generate Application Integrity Manifest
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "DhirDhar Solution/scripts/generate-integrity-manifest.ps1" -TargetDir "DhirDhar Solution/Release"

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "DhirDhar Solution/installer.iss"

      - name: Generate SHA-256 Checksum
        run: |
          $installerPath = "DhirDhar Solution/Installer/DhirDhar-2.1.1-x64-Setup.exe"
          $sha256 = (Get-FileHash -Path $installerPath -Algorithm SHA256).Hash.ToUpperInvariant()
          "$sha256  DhirDhar-2.1.1-x64-Setup.exe" | Out-File -FilePath "DhirDhar Solution/Installer/DhirDhar-2.1.1-x64-Setup.exe.sha256" -Encoding ascii -Force
          Write-Host "Generated SHA-256: $sha256"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: DhirDhar Solution ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # DhirDhar Solution ${{ github.ref_name }}

            ## Dashboard
            - Outstanding Overview now works year-wise.
            - Opening, New Loans, Payments, and Closing are calculated for the selected year.
            - Years with no transactions display zero values.
            - Chart displays January through December for the selected year.
            - Increased chart scale support up to ₹10,00,000.
            - Four grouped vertical bars per month.
            - New Loans = Orange.
            - Withdrawals = Red.
            - Deposits = Green.
            - Interest Earned = Blue.
          files: |
            DhirDhar Solution/Installer/DhirDhar-2.1.1-x64-Setup.exe
            DhirDhar Solution/Installer/DhirDhar-2.1.1-x64-Setup.exe.sha256
            release.json
